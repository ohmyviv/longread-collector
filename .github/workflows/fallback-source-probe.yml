name: Fallback source probe

on:
  push:
    branches:
      - agent/fix-known-fallback-sources
    paths:
      - '.github/workflows/fallback-source-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/fallback-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Probe candidate endpoints
        run: |
          python - <<'PY'
          import json, re
          import httpx

          urls = [
              'https://www.jiemian.com/lists/153.html',
              'https://www.jiemian.com/lists/423.html',
              'https://knowablemagazine.org/rss.xml',
              'https://www.knowablemagazine.org/rss',
              'https://www.deeptechchina.com/',
              'https://www.deeptechchina.com/sitemap.xml',
              'https://www.deeptechchina.com/feed',
              'https://r.jina.ai/http://www.deeptechchina.com/',
              'https://insideclimatenews.org/feed/',
              'https://insideclimatenews.org/News/',
              'https://insideclimatenews.org/wp-json/wp/v2/posts?per_page=10',
              'https://r.jina.ai/http://insideclimatenews.org/News/',
          ]
          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; LongreadCollector/0.5; +https://github.com/ohmyviv/longread-collector)',
              'Accept': '*/*',
          }
          out = []
          with httpx.Client(headers=headers, follow_redirects=True, timeout=20) as client:
              for url in urls:
                  row = {'url': url}
                  try:
                      r = client.get(url)
                      text = r.text
                      row.update({
                          'status': r.status_code,
                          'final_url': str(r.url),
                          'content_type': r.headers.get('content-type', ''),
                          'chars': len(text),
                          'html_hrefs': len(re.findall(r'href=["\']([^"\']+)', text, re.I)),
                          'markdown_links': len(re.findall(r'\[[^\]]{2,200}\]\((https?://[^)]+)\)', text)),
                          'article_urls': len(set(re.findall(r'https?://[^\s"\')<>]+(?:article|news|story|content|detail|20\d{2})[^\s"\')<>]*', text, re.I))),
                          'sample': re.sub(r'\s+', ' ', text[:1200]),
                      })
                  except Exception as exc:
                      row.update({'error_type': type(exc).__name__, 'error': str(exc)[:500]})
                  out.append(row)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
