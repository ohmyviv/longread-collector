name: Longread Collector
run-name: Longread collector · ${{ inputs.group || github.event.schedule }}

on:
  workflow_dispatch:
    inputs:
      group:
        description: Query group to run
        required: true
        default: pre_report
        type: choice
        options:
          - intl_early
          - pre_report
          - zh_midday
          - zh_evening
  schedule:
    # Beijing time. Deadline-sensitive runs are advanced to absorb observed
    # GitHub Actions schedule latency before the 07:35 editorial report.
    - cron: '30 22 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '57 3 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '50 11 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '50 17 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: longread-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install .

      - name: Resolve query group
        id: group
        shell: bash
        env:
          MANUAL_GROUP: ${{ inputs.group }}
          CRON_EXPR: ${{ github.event.schedule }}
        run: |
          if [[ -n "$MANUAL_GROUP" ]]; then
            GROUP="$MANUAL_GROUP"
          else
            case "$CRON_EXPR" in
              '30 22 * * *') GROUP='intl_early' ;;
              '57 3 * * *')  GROUP='pre_report' ;;
              '50 11 * * *') GROUP='zh_midday' ;;
              '50 17 * * *') GROUP='zh_evening' ;;
              *) echo "Unknown schedule: $CRON_EXPR" >&2; exit 2 ;;
            esac
          fi
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
          echo "Running group: $GROUP"

      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json

      - name: Preflight
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
          MAX_URLS_PER_RUN: '32'
          MAX_CONCURRENCY: '2'
          FIRECRAWL_FALLBACK_DAILY_LIMIT: '3'
        run: longread-collector doctor

      - name: Collect and sync with v0.6 parallel shadow
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
          MAX_URLS_PER_RUN: '32'
          MAX_CONCURRENCY: '2'
          FIRECRAWL_FALLBACK_DAILY_LIMIT: '3'
          PIPELINE_ENGINE: v06_shadow
          V06_SHADOW_ENABLED: 'true'
          V06_WRITE_MODE: events_only
          V06_PRIMARY_ENABLED: 'false'
          AUTO_PROMOTE_WHEN_READY: 'false'
          EDITOR_0735_CONNECTED: 'false'
        shell: bash
        run: |
          set -o pipefail
          longread-collector collect --group '${{ steps.group.outputs.group }}' | tee collector-result.json

      - name: Verify durable Discovery snapshot
        shell: bash
        run: |
          jq -e '
            .final_status == "success" and
            .discovery_snapshot_status == "success" and
            .discovery_snapshot_readback_performed == true and
            (.discovery_snapshot_persisted_rows == .discovery_snapshot_rows)
          ' collector-result.json >/dev/null

      - name: Archive parallel-shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v06-shadow-${{ steps.group.outputs.group }}-${{ github.run_id }}
          path: collector-result.json
          if-no-files-found: ignore
          retention-days: 7
