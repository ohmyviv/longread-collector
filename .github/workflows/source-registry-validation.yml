name: Source registry validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/source-registry-v1
    paths:
      - 'config/source_registry_v1.csv'
      - 'src/longread_collector/source_registry_seed.py'
      - 'src/longread_collector/source_validation.py'
      - 'tests/test_source_registry_v1.py'
      - '.github/workflows/source-registry-validation.yml'
  pull_request:
    paths:
      - 'config/source_registry_v1.csv'
      - 'src/longread_collector/source_registry_seed.py'
      - 'src/longread_collector/source_validation.py'
      - 'tests/test_source_registry_v1.py'
      - '.github/workflows/source-registry-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install . pytest
      - name: Registry regression tests
        run: pytest -q tests/test_source_registry_v1.py
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Back up and sync source registry v1
        env:
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: python -m longread_collector.source_registry_seed
      - name: Live endpoint validation
        env:
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          python -m longread_collector.source_validation \
            --output-json artifacts/source-validation.json \
            --output-csv artifacts/source-validation.csv \
            --timeout 15 \
            --concurrency 12 \
            --minimum-enabled-acceptable-rate 0.65
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-registry-validation
          path: artifacts/
          if-no-files-found: warn
