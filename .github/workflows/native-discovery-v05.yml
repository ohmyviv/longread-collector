name: Native source discovery v0.5

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/longread_collector/native_discovery.py'
      - 'src/longread_collector/native_discovery_smoke.py'
      - 'src/longread_collector/known_source_fixes.py'
      - 'src/longread_collector/known_source_fixes_smoke.py'
      - 'src/longread_collector/effective_route_v056.py'
      - 'src/longread_collector/effective_route_extensions_v056.py'
      - 'src/longread_collector/effective_route_smoke_v056.py'
      - 'src/longread_collector/pipeline_v056a.py'
      - 'src/longread_collector/pipeline_v055.py'
      - 'src/longread_collector/pipeline_v054.py'
      - 'src/longread_collector/operational_hotfix.py'
      - 'src/longread_collector/pipeline_v05.py'
      - 'src/longread_collector/pipeline_v051.py'
      - 'src/longread_collector/runtime_config.py'
      - 'src/longread_collector/cli.py'
      - 'requirements.txt'
      - 'tests/test_native_discovery_v05.py'
      - 'tests/test_known_source_fixes.py'
      - 'tests/test_effective_route_v056.py'
      - 'tests/test_effective_route_extensions_v056.py'
      - 'tests/test_operational_hotfix_v053.py'
      - '.github/workflows/native-discovery-v05.yml'

permissions:
  contents: read

jobs:
  validate-native-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install . pytest
      - name: Native discovery regression tests
        run: |
          pytest -q \
            tests/test_native_discovery_v05.py \
            tests/test_known_source_fixes.py \
            tests/test_effective_route_v056.py \
            tests/test_effective_route_extensions_v056.py \
            tests/test_operational_hotfix_v053.py \
            tests/test_source_registry_v1.py
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Live native discovery shadow smoke
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          python -m longread_collector.native_discovery_smoke \
            --max-sources-per-language 12 \
            --limit-per-source 6 \
            --freshness-days 3 \
            --timeout 15 \
            --concurrency 12 \
            --minimum-success-rate 0.40 \
            --output-json artifacts/native-discovery-smoke.json
      - name: Four-source repair smoke
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          python -m longread_collector.known_source_fixes_smoke \
            --output-json artifacts/known-source-fixes-smoke.json
      - name: Effective route recall smoke
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          python -m longread_collector.effective_route_smoke_v056 \
            --minimum-target-recall 0.75 \
            --output-json artifacts/effective-route-v056-smoke.json
      - name: Upload native discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-discovery-v05
          path: artifacts/
          if-no-files-found: warn
