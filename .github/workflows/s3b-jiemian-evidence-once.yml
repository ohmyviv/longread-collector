name: S3-B Jiemian evidence completion once

on:
  push:
    branches:
      - phase3/jiemian-s3b-evidence-completion
    paths:
      - .s3b-jiemian-evidence/run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run exact bounded S3-B evidence completion
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python scripts/s3b_jiemian_evidence_completion.py \
            --output s3b-jiemian-evidence-results.json \
            --manifest-output s3b-jiemian-evidence-manifest.json
      - name: Archive immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3b-jiemian-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            s3b-jiemian-evidence-results.json
            s3b-jiemian-evidence-manifest.json
