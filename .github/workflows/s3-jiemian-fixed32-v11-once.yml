name: S3 Jiemian fixed-32 v1.1 once
run-name: S3 Jiemian fixed-32 v1.1 · ${{ github.sha }}

on:
  push:
    branches:
      - phase3/jiemian-s3-fixed32-counterfactual
    paths:
      - '.s3-jiemian-fixed32-v11/run'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Run read-only frozen S3 v1.1 replay
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
        run: |
          python scripts/s3_jiemian_fixed32_replay_v11.py --output s3-jiemian-fixed32-replay-v11.json
          jq -e '.read_only == true and .network_body_requests == 0 and .sheet_writes == 0 and .production_mutations == 0' s3-jiemian-fixed32-replay-v11.json >/dev/null
          jq '{version,status,control_replays,evidence_completion_manifest,treatment_entry_intended_dates}' s3-jiemian-fixed32-replay-v11.json
      - name: Archive immutable replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-jiemian-fixed32-v11-${{ github.run_id }}
          path: s3-jiemian-fixed32-replay-v11.json
          if-no-files-found: error
          retention-days: 30
