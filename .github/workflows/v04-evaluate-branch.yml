name: V0.4 ground-truth evaluation

# Controlled evaluation iteration 2: source-lead and batch-dedupe fixes.
on:
  push:
    branches:
      - agent/collector-v0.4-ground-truth
    paths:
      - .github/workflows/v04-evaluate-branch.yml

permissions:
  contents: read

concurrency:
  group: v04-ground-truth-evaluation
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Evaluate fixed 48-item release fixture
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: longread-collector evaluate-ground-truth
