name: Diagnostic v0.5.6k

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests and retain output
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          echo "$code" > pytest-exit-code.txt
          exit "$code"
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-v056k-output
          path: |
            pytest-output.txt
            pytest-exit-code.txt
