name: Day 1 production-cache replay v0.5.6l

on:
  pull_request:
    paths:
      - 'src/longread_collector/day1_replay_v056l.py'
      - 'src/longread_collector/classification_v056l.py'
      - 'src/longread_collector/publication_date_v056l.py'
      - 'src/longread_collector/post_extraction_gates_v056l.py'
      - 'src/longread_collector/historical_dedupe_v056l.py'
      - 'src/longread_collector/pipeline_v056d.py'
      - '.github/workflows/day1-replay-v056l.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-day1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Replay 32 reviewed cache rows
        run: |
          python -m longread_collector.day1_replay_v056l \
            --spreadsheet-id 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4 \
            --credentials-file /tmp/google-service-account.json \
            --output-json artifacts/day1-replay-v056l.json
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day1-replay-v056l
          path: artifacts/day1-replay-v056l.json
          if-no-files-found: warn
