name: S2-B isolated body validation

on:
  push:
    branches:
      - phase3/s2b-execution-v1
    paths:
      - '.s2b-manifest-trigger'
      - '.s2b-execute-trigger'
      - '.s2b-validate-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: s2b-isolated-body-validation
  cancel-in-progress: false

jobs:
  s2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .

      - name: Resolve execution phase
        id: phase
        shell: bash
        run: |
          if [[ -f .s2b-validate-trigger ]]; then
            echo 'mode=validate' >> "$GITHUB_OUTPUT"
          elif [[ -f .s2b-execute-trigger ]]; then
            echo 'mode=execute' >> "$GITHUB_OUTPUT"
          elif [[ -f .s2b-manifest-trigger ]]; then
            echo 'mode=manifest' >> "$GITHUB_OUTPUT"
          else
            echo 'No explicit S2-B trigger file found' >&2
            exit 2
          fi

      - name: Prepare Google credentials
        if: ${{ steps.phase.outputs.mode == 'manifest' || steps.phase.outputs.mode == 'validate' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json

      - name: Materialize frozen manifest only
        if: ${{ steps.phase.outputs.mode == 'manifest' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
        run: python scripts/s2b_materialize_manifest.py --output s2b-manifest.json

      - name: Verify frozen acquisition semantics
        if: ${{ steps.phase.outputs.mode == 'execute' }}
        run: |
          git fetch --no-tags --depth=1 origin a380c68920c1de26f1e703b721d7eb2195900002
          git diff --exit-code a380c68920c1de26f1e703b721d7eb2195900002 HEAD -- \
            src/longread_collector/extraction.py \
            src/longread_collector/clients.py \
            src/longread_collector/pipeline.py \
            src/longread_collector/config.py

      - name: Download verified manifest artifact
        if: ${{ steps.phase.outputs.mode == 'execute' }}
        uses: actions/download-artifact@v4
        with:
          name: s2b-evidence-33241941984
          path: verified-manifest
          github-token: ${{ github.token }}
          repository: ohmyviv/longread-collector
          run-id: 33241941984

      - name: Verify execution preconditions
        if: ${{ steps.phase.outputs.mode == 'execute' }}
        run: |
          test -f verified-manifest/s2b-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('verified-manifest/s2b-manifest.json').read_text())
          assert p['schema_version']=='zh-route-shadow-s2b-manifest-v1'
          assert p['source_row_count']==129
          assert len(p['items'])==40
          assert p['manifest_sha256']=='7946ce964f82abd14a95e925769dbcde484dd581d0713d4996f149cb216a247b'
          print(p['manifest_sha256'])
          PY

      - name: Execute bounded body acquisition
        if: ${{ steps.phase.outputs.mode == 'execute' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
          MAX_URLS_PER_RUN: '40'
          MAX_CONCURRENCY: '2'
          FIRECRAWL_FALLBACK_DAILY_LIMIT: '3'
          MIN_BODY_CHARS: '1200'
          EDITOR_MIN_BODY_CHARS: '2500'
        run: |
          python scripts/s2b_execute_body_audit.py \
            --manifest verified-manifest/s2b-manifest.json \
            --output s2b-acquisition-results.json

      - name: Validate reviewed result ledger
        if: ${{ steps.phase.outputs.mode == 'validate' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
        run: python scripts/s2b_validate_sheet_results.py --output s2b-validation-summary.json

      - name: Archive S2-B evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2b-evidence-${{ github.run_id }}
          path: |
            s2b-manifest.json
            verified-manifest/s2b-manifest.json
            s2b-acquisition-results.json
            s2b-validation-summary.json
          if-no-files-found: error
          retention-days: 14
