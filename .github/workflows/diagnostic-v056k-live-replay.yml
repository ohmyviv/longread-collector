name: Diagnostic v0.5.6k live replay

on:
  pull_request:

permissions:
  contents: read

jobs:
  replay-reviewed-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Replay reviewed Aug 5 cache rows
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
        run: |
          mkdir -p artifacts
          cat > /tmp/replay_v056k.py <<'PY'
          from __future__ import annotations

          from datetime import datetime
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import gspread

          from longread_collector.classification_v056k import classify_candidate_v056k
          from longread_collector.content_identity_v056j import evaluate_content_identity
          from longread_collector.models import DiscoveredURL, ExtractedArticle
          from longread_collector.pipeline_v056d import _apply_classification
          from longread_collector.post_extraction_gates_v056k import apply_post_extraction_gates_v056k

          BJ = ZoneInfo('Asia/Shanghai')
          NOW = datetime(2026, 8, 5, 22, 0, tzinfo=BJ)
          TARGET_BATCHES = {
              'V056J-DAY1-20260805-BLOCKER4',
              'V056J-DAY1-20260805-PREREPORT-CANDIDATES',
              'V056J-DAY1-20260805-ZH-MIDDAY-CANDIDATES',
              'V056J-DAY1-20260805-ZH-MIDDAY-REJECTS',
          }

          def pad(row: list[str], size: int) -> list[str]:
              return row + [''] * max(0, size - len(row))

          client = gspread.service_account(filename=os.environ['GOOGLE_SERVICE_ACCOUNT_FILE'])
          book = client.open_by_key(os.environ['GOOGLE_SHEET_ID'])
          reviews = book.worksheet('collector_shadow_review_items').get('A313:X369')

          latest: dict[str, list[str]] = {}
          for raw in reviews:
              row = pad(raw, 24)
              review_article_id = row[4].strip()
              if review_article_id and row[20].strip() in TARGET_BATCHES:
                  latest[review_article_id] = row

          cache = book.worksheet('article_cache')
          ordered: list[tuple[str, list[str], int]] = []
          ranges: list[str] = []
          for review_article_id, review in latest.items():
              try:
                  cache_row = int(float(review[3]))
              except ValueError:
                  continue
              ordered.append((review_article_id, review, cache_row))
              ranges.append(f'A{cache_row}:AV{cache_row}')

          payloads = cache.batch_get(ranges)
          results: list[dict[str, object]] = []
          skipped: list[dict[str, object]] = []
          for (review_article_id, review, cache_row), payload in zip(ordered, payloads, strict=True):
              values = pad(payload[0] if payload else [], 48)
              cache_article_id = values[0].strip()
              extraction_status = values[16].strip()
              markdown = values[20]
              if extraction_status != 'success' or len(markdown.strip()) < 500:
                  skipped.append({
                      'review_article_id': review_article_id,
                      'cache_article_id': cache_article_id,
                      'cache_article_id_mismatch': cache_article_id != review_article_id,
                      'cache_row': cache_row,
                      'title': values[8],
                      'reason': 'body_not_evaluable',
                      'extraction_status': extraction_status,
                      'markdown_chars': len(markdown.strip()),
                  })
                  continue

              try:
                  metadata = json.loads(values[22] or '{}')
              except json.JSONDecodeError:
                  metadata = {}
              discovery_meta = dict(metadata.get('discovery') or {})
              discovery_meta['discovery'] = metadata.get('discovery') or {}

              discovered = DiscoveredURL(
                  url=values[6] or values[5],
                  title=values[8],
                  description=values[14],
                  published_at=values[10],
                  discovery_method=values[3],
                  query_or_source=values[4],
                  language=values[11],
                  metadata=discovery_meta,
              )
              identity = evaluate_content_identity(
                  title=values[8],
                  markdown=markdown,
                  discovered_title=values[8],
              )
              classified = classify_candidate_v056k(
                  url=values[6] or values[5],
                  title=values[8],
                  description=values[14],
                  author=values[9],
                  markdown=markdown,
                  published_at=values[10],
                  verification_level=values[17],
                  content_chars=identity.body_prose_chars,
              )
              article = ExtractedArticle(
                  article_id=review_article_id,
                  url=values[5],
                  url_canonical=values[6] or values[5],
                  domain=values[7],
                  title=values[8],
                  author=values[9],
                  published_at=values[10],
                  language=values[11],
                  canonical_source=values[12],
                  hosting_source=values[13],
                  description=values[14],
                  extractor_used=values[15],
                  extraction_status=extraction_status,
                  verification_level=values[17],
                  content_markdown=markdown,
                  content_chars=int(float(values[18] or 0)),
                  classification_version='collector-v0.5.6k',
                  metadata={'content_identity': identity.as_dict()},
              )
              _apply_classification(article, classified)
              apply_post_extraction_gates_v056k(discovered, article, now=NOW)

              expected_disposition = review[10].strip()
              expected_relationship = review[11].strip()
              disposition_ok = article.candidate_disposition == expected_disposition
              relationship_ok = (
                  not expected_relationship
                  or article.source_relationship == expected_relationship
              )
              results.append({
                  'review_article_id': review_article_id,
                  'cache_article_id': cache_article_id,
                  'cache_article_id_mismatch': cache_article_id != review_article_id,
                  'cache_row': cache_row,
                  'title': values[8],
                  'expected_disposition': expected_disposition,
                  'actual_disposition': article.candidate_disposition,
                  'expected_source_relationship': expected_relationship,
                  'actual_source_relationship': article.source_relationship,
                  'disposition_ok': disposition_ok,
                  'relationship_ok': relationship_ok,
                  'classification_reason': article.classification_reason,
                  'reject_reason': article.reject_reason,
                  'published_at': article.published_at,
                  'published_at_source': article.metadata.get('freshness', {}).get('published_at_source', ''),
                  'body_prose_chars': identity.body_prose_chars,
              })

          disposition_correct = sum(bool(item['disposition_ok']) for item in results)
          relationship_correct = sum(bool(item['relationship_ok']) for item in results)
          report = {
              'version': 'collector-v0.5.6k',
              'reviewed_unique': len(latest),
              'evaluable': len(results),
              'expected_evaluable': 55,
              'skipped': skipped,
              'cache_article_id_mismatches': sum(bool(item['cache_article_id_mismatch']) for item in results),
              'disposition_correct': disposition_correct,
              'disposition_accuracy': disposition_correct / len(results) if results else 0,
              'source_relationship_correct': relationship_correct,
              'source_relationship_accuracy': relationship_correct / len(results) if results else 0,
              'mismatches': [item for item in results if not item['disposition_ok'] or not item['relationship_ok']],
              'items': results,
          }
          path = Path('artifacts/v056k-live-shadow-replay.json')
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          summary = {key: value for key, value in report.items() if key != 'items'}
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '## v0.5.6k live shadow replay\n\n```json\n'
              + json.dumps(summary, ensure_ascii=False, indent=2)
              + '\n```\n',
              encoding='utf-8',
          )
          if (
              report['evaluable'] != report['expected_evaluable']
              or report['disposition_accuracy'] < 1.0
              or report['source_relationship_accuracy'] < 1.0
          ):
              raise SystemExit(1)
          PY
          python /tmp/replay_v056k.py
      - name: Upload live replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v056k-live-shadow-replay
          path: artifacts/v056k-live-shadow-replay.json
          if-no-files-found: error
