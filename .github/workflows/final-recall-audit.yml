name: Final recommendation recall audit

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date in YYYY-MM-DD; blank uses current Beijing date'
        required: false
        type: string
      dry_run:
        description: 'Calculate without writing audit sheets'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'src/longread_collector/final_recall_audit.py'
      - 'src/longread_collector/recall_instrumentation.py'
      - 'src/longread_collector/pipeline_v051.py'
      - 'tests/test_final_recall_audit.py'
      - '.github/workflows/final-recall-audit.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install . pytest
      - run: pytest -q tests/test_final_recall_audit.py tests/test_native_discovery_v05.py tests/test_known_source_fixes.py

  audit:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Audit final recommendation recall
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          mkdir -p artifacts
          args=(--lookback-hours 48 --output-json artifacts/final-recall-audit.json)
          if [ -n "$REPORT_DATE" ]; then
            args+=(--report-date "$REPORT_DATE")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m longread_collector.final_recall_audit "${args[@]}"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-recall-audit-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
