name: Final recommendation recall audit

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date in YYYY-MM-DD; blank uses current Beijing date'
        required: false
        type: string
      dry_run:
        description: 'Calculate without writing audit sheets'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'src/longread_collector/final_recall_audit.py'
      - 'src/longread_collector/final_recall_audit_v11.py'
      - 'src/longread_collector/final_recall_audit_v11_runner.py'
      - 'src/longread_collector/registry_matching_v056.py'
      - 'src/longread_collector/recall_instrumentation.py'
      - 'src/longread_collector/pipeline_v051.py'
      - 'tests/test_final_recall_audit.py'
      - 'tests/test_final_recall_audit_v11.py'
      - 'tests/test_final_recall_workflow_v11.py'
      - '.github/workflows/final-recall-audit.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install . pytest
      - run: >-
          pytest -q
          tests/test_final_recall_audit.py
          tests/test_final_recall_audit_v11.py
          tests/test_final_recall_workflow_v11.py
          tests/test_native_discovery_v05.py
          tests/test_known_source_fixes.py

  live-dry-run:
    if: github.event_name == 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Read known final items and calculate v1.1 without writes
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          mkdir -p artifacts
          python -m longread_collector.final_recall_audit_v11_runner \
            --report-date 2026-08-02 \
            --cutoff-time 07:35 \
            --lookback-hours 48 \
            --dry-run \
            > artifacts/final-recall-audit-v11-dry-run-summary.json
          cat artifacts/final-recall-audit-v11-dry-run-summary.json
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-recall-v11-dry-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

  audit:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Audit final recommendation recall v1.1
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          mkdir -p artifacts
          report_date="${REPORT_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          args=(
            --report-date "$report_date"
            --cutoff-time 07:35
            --lookback-hours 48
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          for attempt in 1 2 3; do
            if python -m longread_collector.final_recall_audit_v11_runner "${args[@]}" \
              > artifacts/final-recall-audit-v11-summary.json; then
              cat artifacts/final-recall-audit-v11-summary.json
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Recall audit v1.1 failed; waiting for the Sheets quota window (attempt $attempt/3)."
            sleep 95
          done
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-recall-audit-v11-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
