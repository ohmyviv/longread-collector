name: Editorial recall hotfix v0.5.5

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/longread_collector/classification_v055.py'
      - 'src/longread_collector/classification_v056.py'
      - 'src/longread_collector/source_relationship_v056.py'
      - 'src/longread_collector/source_chase_v055.py'
      - 'src/longread_collector/source_chase_v056.py'
      - 'src/longread_collector/freshness_v056.py'
      - 'src/longread_collector/freshness_policy_v056.py'
      - 'src/longread_collector/page_gates_v056.py'
      - 'src/longread_collector/page_gate_policy_v056.py'
      - 'src/longread_collector/post_extraction_gates_v056.py'
      - 'src/longread_collector/ranked_selection_v055.py'
      - 'src/longread_collector/ranked_selection_v056.py'
      - 'src/longread_collector/ranked_freshness_v056.py'
      - 'src/longread_collector/ranked_selection_plan_v056.py'
      - 'src/longread_collector/selection_plan_v056.py'
      - 'src/longread_collector/staged_reserve_v056.py'
      - 'src/longread_collector/prefilter_v056.py'
      - 'src/longread_collector/prefilter_v056c.py'
      - 'src/longread_collector/operational_audit_v056.py'
      - 'src/longread_collector/final_recall_audit_v11.py'
      - 'src/longread_collector/pipeline_v055.py'
      - 'src/longread_collector/pipeline_v056a.py'
      - 'src/longread_collector/pipeline_v056b.py'
      - 'src/longread_collector/pipeline_v056c.py'
      - 'src/longread_collector/pipeline_v056d.py'
      - 'src/longread_collector/pipeline_v056e.py'
      - 'src/longread_collector/pipeline_v054.py'
      - 'src/longread_collector/known_source_fixes_smoke.py'
      - 'tests/test_editorial_hotfix_v055.py'
      - 'tests/test_classification_v056.py'
      - 'tests/test_source_relationship_v056.py'
      - 'tests/test_source_chase_v056.py'
      - 'tests/test_selection_reserve_v056.py'
      - 'tests/test_staged_reserve_v056.py'
      - 'tests/test_freshness_v056.py'
      - 'tests/test_freshness_policy_v056.py'
      - 'tests/test_page_gates_v056.py'
      - 'tests/test_page_gate_policy_v056.py'
      - 'tests/test_post_extraction_gates_v056.py'
      - 'tests/test_operational_audit_v056.py'
      - 'tests/test_final_recall_audit_v11.py'
      - '.github/workflows/editorial-hotfix-v055.yml'
      - '.github/workflows/collector.yml'

permissions:
  contents: read

jobs:
  validate-editorial-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install . pytest
      - name: Full collector regression suite
        run: pytest -q
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Doctor against production Sheet
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: longread-collector doctor
      - name: Live 24-source native discovery smoke
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          python -m longread_collector.native_discovery_smoke \
            --max-sources-per-language 12 \
            --limit-per-source 6 \
            --freshness-days 3 \
            --timeout 15 \
            --concurrency 12 \
            --minimum-success-rate 0.40 \
            --output-json artifacts/native-discovery-smoke-v055.json
      - name: Four-source route-health smoke
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_SHEET_ID: 1Ohi2amTCPnIZZont7rwOLO487DFk64-pemLT8O76xq4
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
          TIMEZONE: Asia/Shanghai
        run: |
          for attempt in 1 2 3; do
            if python -m longread_collector.known_source_fixes_smoke \
              --output-json artifacts/known-source-fixes-smoke-v055.json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Sheet-backed smoke failed; using staggered quota backoff (attempt $attempt/3)."
            sleep 95
          done
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-hotfix-v055
          path: artifacts/
          if-no-files-found: warn
