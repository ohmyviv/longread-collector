name: S3 fixed32 v1.2 closeout once

on:
  push:
    branches:
      - phase3/jiemian-s3b-evidence-completion
    paths:
      - .s3-v12-fixed32-closeout/run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64"
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/google-service-account.json
          chmod 600 /tmp/google-service-account.json
      - name: Replay frozen cohort with outcome-aware evidence
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-service-account.json
        run: |
          python scripts/s3_jiemian_fixed32_replay_v12.py \
            --output s3-jiemian-fixed32-replay-v12.json
      - name: Archive immutable read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3-jiemian-fixed32-v12-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: s3-jiemian-fixed32-replay-v12.json
