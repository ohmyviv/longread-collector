[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "longread-collector"
version = "0.5.0"
description = "Source-aware native discovery, extraction, semantic classification and shadow evaluation for the daily longread workflow"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
longread-collector = "longread_collector.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
